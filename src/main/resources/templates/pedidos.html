<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th>Desconto</th>
                        <th>Total</th>
                        <th>Entrada</th>
                        <th>Responsável</th>
                        <th>Saída</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="10" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted small" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td>
                            <ul class="list-unstyled mb-0 small" th:if="${pedido.itens != null}">
                                <li th:each="item : ${pedido.itens}">
                                    <span th:text="${item.quantidade}"></span>x
                                    <span th:text="${item.nome}"></span>
                                    (<span th:text="${item.precoUnitario}"></span>)
                                </li>
                            </ul>
                        </td>
                        <td th:text="${pedido.descontoPercentual != null} ? ${pedido.descontoPercentual} + '%' : '0%'"></td>
                        <td th:text="${pedido.valorTotal}"></td>
                        <td class="small" th:text="${pedido.dataHoraEntrada != null} ? ${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')} : '—'"></td>
                        <td th:text="${pedido.responsavelRegistro}"></td>
                        <td class="small">
                            <span th:if="${pedido.dataHoraSaida != null}"
                                  th:text="${#temporals.format(pedido.dataHoraSaida, 'dd/MM/yyyy HH:mm') + ' — ' + pedido.responsavelSaida}"></span>
                            <span th:if="${pedido.dataHoraSaida == null}">—</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <div sec:authorize="hasAnyRole('GERENTE','ATENDENTE')"
                                 th:if="${pedido.status != 'CANCELADO' and pedido.status != 'FINALIZADO'}">
                                <form th:if="${pedido.status == 'RECEBIDO'}"
                                      th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="EM_PREPARACAO"/>
                                    <button type="submit" class="btn btn-sm btn-outline-primary mb-1">Em preparação</button>
                                </form>
                                <form th:if="${pedido.status == 'EM_PREPARACAO'}"
                                      th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="PRONTO"/>
                                    <button type="submit" class="btn btn-sm btn-outline-primary mb-1">Pronto</button>
                                </form>
                                <form th:if="${pedido.status == 'PRONTO'}"
                                      th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="SAIU_PARA_ENTREGA"/>
                                    <button type="submit" class="btn btn-sm btn-outline-primary mb-1">Saiu para entrega</button>
                                </form>
                                <form th:if="${pedido.status == 'PRONTO'}"
                                      th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="RETIRADO"/>
                                    <button type="submit" class="btn btn-sm btn-outline-primary mb-1">Retirado</button>
                                </form>
                                <form th:if="${pedido.status == 'SAIU_PARA_ENTREGA' or pedido.status == 'RETIRADO'}"
                                      th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="FINALIZADO"/>
                                    <button type="submit" class="btn btn-sm btn-outline-success mb-1">Finalizar</button>
                                </form>
                            </div>
                            <div sec:authorize="hasRole('GERENTE')"
                                 th:if="${pedido.status == 'RECEBIDO' or pedido.status == 'EM_PREPARACAO' or pedido.status == 'PRONTO'}">
                                <form th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post" class="d-flex gap-1 mb-1 justify-content-end">
                                    <input type="number" name="percentual" class="form-control form-control-sm" style="width: 80px;" min="0.01" max="20" step="0.01" required/>
                                    <button type="submit" class="btn btn-sm btn-outline-warning">Desconto</button>
                                </form>
                                <form th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" class="d-flex gap-1 justify-content-end">
                                    <input type="text" name="justificativa" class="form-control form-control-sm" placeholder="Justificativa" required/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
